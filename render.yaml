databases:
  - name: meshtech-db
    plan: free
    databaseName: meshtech
    user: meshtech

services:
  - type: web
    name: meshtech-md-v2.5
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:multi-user
    healthCheckPath: /health
    envVars:
      - key: SESSION_ID
        value: ""
      - key: MULTI_USER_AUTH_DIR
        value: /data/meshtech/auth_sessions
      - key: MAX_BOT_INSTANCES
        value: unlimited
      - key: MODE
        value: public
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: AUTO_LIKE_STATUS
        value: "true"
      - key: AUTO_READ_STATUS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: meshtech-db
          property: connectionString
